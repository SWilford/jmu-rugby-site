name: Nightly CI

on:
  schedule:
    - cron: '0 16 * * *'  # Daily at ~12 PM Eastern (16:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ci
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
