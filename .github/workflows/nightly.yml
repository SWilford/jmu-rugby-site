name: Nightly CI

on:
  schedule:
    - cron: '0 16 * * *'  # Daily at ~12 PM Eastern (16:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ci
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
